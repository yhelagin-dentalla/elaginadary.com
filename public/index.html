<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Darya Elagina — Coming soon</title>
<meta name="description" content="A new space by Darya Elagina is coming soon.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Libre+Caslon+Display&family=Mrs+Saint+Delafield&family=Source+Sans+3:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f8f2e7;
    --paper-2:#f3eadb;
    --ink:#3b2a22;
    --ink-soft:#5a4a40;
    --gold:#c8a15a;
    --gold-soft:#dcc08a;
    --sky:#b9cde3;
    --kraft:#eadcc2;
    --tape:rgba(226,211,178,.78);
    --shadow:0 18px 40px -14px rgba(70,45,25,.35), 0 4px 10px -4px rgba(70,45,25,.18);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Source Sans 3",system-ui,sans-serif;
    font-weight:300;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.55;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .36  0 0 0 0 .26  0 0 0 .09 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  body::after{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:
      radial-gradient(900px 600px at 78% 30%, rgba(255,255,255,.55), transparent 60%),
      radial-gradient(700px 500px at 10% 100%, rgba(214,190,150,.18), transparent 65%);
  }

  .page{
    position:relative;z-index:1;
    min-height:100vh;
    max-width:1440px;margin:0 auto;
    padding:44px clamp(16px,5vw,72px) 56px;
    display:grid;
    grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);
    grid-template-rows:auto 1fr;
    column-gap:clamp(24px,4vw,64px);
  }

  header{grid-column:1/-1;display:flex;justify-content:space-between;align-items:flex-start}
  .logo{position:relative;font-family:"Cormorant Garamond",serif;font-weight:500;font-size:clamp(26px,2.6vw,36px);letter-spacing:.01em;color:var(--ink);text-decoration:none;display:inline-block;padding-bottom:18px}
  .logo svg{position:absolute;left:34px;bottom:0;width:112px;height:18px}

  .lang{
    display:flex;align-items:center;gap:4px;
    border:1px solid rgba(59,42,34,.22);border-radius:999px;padding:5px;
    background:rgba(255,255,255,.35);backdrop-filter:blur(4px);
  }
  .lang button{
    font:500 13px/1 "Source Sans 3",sans-serif;letter-spacing:.08em;color:var(--ink);
    background:transparent;border:0;border-radius:999px;padding:10px 18px;cursor:pointer;
    transition:background .3s,color .3s;
  }
  .lang button[aria-pressed="true"]{background:var(--paper-2);box-shadow:inset 0 0 0 1px rgba(200,161,90,.25)}
  .lang button:not([aria-pressed="true"]):hover{background:rgba(234,220,194,.45)}
  .lang .sep{width:1px;height:16px;background:rgba(59,42,34,.25)}

  .copy{align-self:center;padding:40px 0 60px;max-width:600px}
  [data-i18n]{transition:opacity .35s ease}
  .fading [data-i18n]{opacity:0}

  h1{
    font-family:"Libre Caslon Display","Cormorant Garamond",serif;font-weight:400;
    font-size:clamp(46px,6.3vw,94px);line-height:1.02;letter-spacing:-.015em;
    color:var(--ink);
    opacity:0;transform:translateY(14px);animation:rise .9s .15s ease forwards;
  }
  .lead{
    margin-top:28px;font-size:clamp(17px,1.45vw,21px);line-height:1.6;color:var(--ink-soft);max-width:30em;
    opacity:0;transform:translateY(14px);animation:rise .9s .35s ease forwards;
  }
  .swash{display:block;margin-top:34px;width:110px;height:22px;opacity:0;animation:fade 1s .6s ease forwards}

  .social{
    margin-top:30px;display:flex;flex-wrap:wrap;gap:12px;
    opacity:0;transform:translateY(14px);animation:rise .9s .55s ease forwards;
  }
  .social a{
    display:inline-flex;align-items:center;gap:10px;
    padding:12px 20px;border-radius:999px;text-decoration:none;
    font:400 15px/1 "Source Sans 3",sans-serif;letter-spacing:.02em;color:var(--ink);
    border:1px solid rgba(59,42,34,.22);background:rgba(255,255,255,.4);
    transition:background .3s,transform .3s,border-color .3s;
  }
  .social a:hover{background:#fff;border-color:var(--gold);transform:translateY(-2px)}
  .social svg{width:18px;height:18px}

  .collage{position:relative;min-height:640px;align-self:stretch}
  .wash{position:absolute;pointer-events:none;filter:blur(.4px)}
  .wash.w1{left:0;top:40%;width:34%;height:46%}
  .wash.w2{right:6%;top:3%;width:40%;height:34%}
  .wash.w3{left:30%;bottom:2%;width:46%;height:18%}

  .photo{
    position:absolute;background:#fbf8f2;padding:12px 12px 14px;box-shadow:var(--shadow);
    opacity:0;animation:drop 1.1s cubic-bezier(.2,.8,.2,1) forwards;
    transition:transform .5s cubic-bezier(.2,.8,.2,1);
  }
  .photo img{display:block;width:100%;height:100%;object-fit:cover}
  .photo.main{left:9%;top:4%;width:60%;aspect-ratio:525/643;--r:-2.2deg;transform:rotate(var(--r));animation-delay:.25s}
  .photo.side{right:0;top:13%;width:37%;aspect-ratio:528/620;--r:4deg;transform:rotate(var(--r));animation-delay:.5s;z-index:2}
  .photo:hover{transform:rotate(0deg) translateY(-6px) scale(1.015)}

  .tape{
    position:absolute;height:38px;width:120px;background:var(--tape);z-index:3;
    clip-path:polygon(2% 8%,10% 0,22% 7%,36% 1%,50% 6%,64% 0,78% 6%,90% 1%,100% 9%,98% 92%,88% 100%,74% 94%,60% 100%,46% 95%,32% 100%,18% 94%,6% 100%,0 90%);
    box-shadow:0 1px 2px rgba(0,0,0,.06);
  }
  .photo.main .tape{top:-20px;left:30%;transform:rotate(-3deg)}
  .photo.side .tape{top:-16px;right:18%;width:92px;transform:rotate(8deg)}

  .note{
    position:absolute;right:1%;bottom:4%;width:34%;min-width:220px;aspect-ratio:1.05/1;
    background:var(--kraft);z-index:1;
    clip-path:polygon(0 3%,6% 0,20% 2%,38% 0,55% 3%,72% 0,90% 2%,100% 0,98% 22%,100% 45%,97% 70%,100% 100%,78% 98%,56% 100%,34% 97%,14% 100%,0 98%,2% 70%,0 44%,3% 20%);
    transform:rotate(-3deg);
    box-shadow:var(--shadow);
    display:flex;align-items:center;justify-content:center;
    opacity:0;animation:fade 1s .9s ease forwards;
  }
  .note::before{content:"";position:absolute;inset:0;opacity:.5;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='k'><feTurbulence type='fractalNoise' baseFrequency='1.2' numOctaves='2'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .38  0 0 0 0 .22  0 0 0 .14 0'/></filter><rect width='100%' height='100%' filter='url(%23k)'/></svg>")}
  .note .script{
    position:relative;font-family:"Mrs Saint Delafield",cursive;color:var(--ink);
    font-size:clamp(58px,5.4vw,86px);line-height:.78;transform:rotate(-12deg);text-align:center;
  }
  .note .script span{display:block}
  .note .script span+span{padding-left:.8em}
  .note .heart{position:absolute;right:30%;bottom:13%;width:30px;height:30px}

  .daisy{
    position:absolute;left:0;top:58%;width:170px;z-index:4;pointer-events:none;
    opacity:0;animation:fade 1.2s 1s ease forwards;
    transform-origin:50% 50%;animation:fade 1.2s 1s ease forwards;
  }
  .daisy img{position:relative;z-index:2;width:100%;display:block;filter:drop-shadow(0 8px 10px rgba(80,60,30,.22))}
  .daisy .stem{position:absolute;left:48%;top:52%;width:130%;height:190%;z-index:1;overflow:visible}
  .stem path{stroke-dasharray:600;stroke-dashoffset:600;animation:draw 2.2s 1.2s ease forwards}
  .swirl{position:absolute;left:-6%;bottom:0;width:70%;height:30%;z-index:0;pointer-events:none;overflow:visible}
  .swirl path{stroke-dasharray:900;stroke-dashoffset:900;animation:draw 3s 1.4s ease forwards}

  .sparkle{position:absolute;right:1%;top:10%;width:34px;height:34px;opacity:0;animation:fade 1s 1.2s forwards}

  .leaves{position:fixed;left:-60px;bottom:-60px;width:520px;height:420px;pointer-events:none;z-index:0;opacity:.28;filter:blur(14px)}

  footer{grid-column:1/-1;align-self:end;font-size:13px;letter-spacing:.04em;color:rgba(59,42,34,.55);padding-top:20px}

  @keyframes rise{to{opacity:1;transform:none}}
  @keyframes fade{to{opacity:1}}
  @keyframes drop{from{opacity:0;transform:rotate(var(--r)) translateY(24px)}to{opacity:1;transform:rotate(var(--r))}}
  @keyframes draw{to{stroke-dashoffset:0}}

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important}
  }

  @media (max-width:1000px){
    .page{grid-template-columns:1fr;grid-template-rows:auto auto auto auto}
    .copy{padding:48px 0 24px;max-width:none}
    .collage{min-height:0;aspect-ratio:1/1.02;margin-top:10px}
  }
  @media (max-width:600px){
    .page{padding:24px 16px 32px}
    .lang button{padding:9px 14px}
    .logo svg{left:24px;width:90px}
    .collage{aspect-ratio:1/1.35}
    .photo.main{left:0;top:4%;width:72%}
    .photo.side{width:46%;top:30%}
    .note{width:52%;min-width:0;right:0;bottom:2%}
    .note .script{font-size:48px}
    .daisy{left:-2%;top:60%;width:110px}
    .wash.w1{left:-6%;width:50%}
    .sparkle{top:26%}
    .swirl{display:none}
    .daisy .stem{height:120%}
  }
</style>
</head>
<body>
<svg class="leaves" viewBox="0 0 520 420" aria-hidden="true">
  <g fill="#8a6b45">
    <path d="M40 400 C120 300 190 250 300 220 C230 280 170 340 120 420Z"/>
    <path d="M110 300 C160 230 230 190 330 170 C280 230 210 280 150 330Z"/>
    <path d="M20 330 C60 250 110 200 200 160 C160 230 110 290 60 360Z"/>
    <path d="M200 420 C240 350 300 310 390 290 C340 350 290 390 250 420Z"/>
    <path d="M0 250 C40 190 80 150 150 120 C120 180 70 230 30 280Z"/>
  </g>
</svg>

<div class="page" id="page">
  <header>
    <a class="logo" href="#" aria-label="Darya Elagina">Darya Elagina
      <svg viewBox="0 0 112 18" aria-hidden="true"><path d="M2 14 C30 4 70 2 110 7" fill="none" stroke="#c8a15a" stroke-width="2" stroke-linecap="round"/></svg>
    </a>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="en" aria-pressed="true">EN</button>
      <span class="sep" aria-hidden="true"></span>
      <button type="button" data-lang="de" aria-pressed="false">DE</button>
    </div>
  </header>

  <main class="copy">
    <h1 data-i18n="title">A new space<br>is coming soon.</h1>
    <p class="lead" data-i18n="lead">A little corner on the internet is taking shape – for ideas, stories, creative projects and everything that inspires me.</p>
    <svg class="swash" viewBox="0 0 110 22" aria-hidden="true"><path d="M3 18 C35 6 70 3 107 5" fill="none" stroke="#dcc08a" stroke-width="2.4" stroke-linecap="round"/></svg>
    <div class="social">
      <a href="https://www.instagram.com/elaginadary" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.4" cy="6.6" r="1" fill="currentColor" stroke="none"/></svg>
        <span data-i18n="insta">Follow on Instagram</span>
      </a>
    </div>
  </main>

  <section class="collage" aria-label="Photos">
    <svg class="wash w1" viewBox="0 0 300 380" preserveAspectRatio="none" aria-hidden="true">
      <defs><filter id="wc" x="-20%" y="-20%" width="140%" height="140%"><feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="3" seed="4"/><feDisplacementMap in="SourceGraphic" scale="26"/></filter></defs>
      <path filter="url(#wc)" fill="#b9cde3" fill-opacity=".7" d="M60 20 C120 0 170 40 150 110 C135 170 210 220 230 290 C245 350 170 380 120 350 C70 320 90 250 50 200 C10 150 0 60 60 20Z"/>
    </svg>
    <svg class="wash w2" viewBox="0 0 300 260" preserveAspectRatio="none" aria-hidden="true">
      <path filter="url(#wc)" fill="#b9cde3" fill-opacity=".6" d="M40 60 C110 10 230 0 280 40 C300 80 250 120 200 140 C140 165 110 230 60 220 C20 210 0 110 40 60Z"/>
    </svg>
    <svg class="wash w3" viewBox="0 0 300 120" preserveAspectRatio="none" aria-hidden="true">
      <path filter="url(#wc)" fill="#b9cde3" fill-opacity=".5" d="M10 70 C60 20 180 10 290 40 C260 90 160 110 60 110 C20 110 0 90 10 70Z"/>
    </svg>

    <figure class="photo main">
      <span class="tape" aria-hidden="true"></span>
      <img src="./assets/img/photo-1.jpg" alt="Darya with her dog in a city café">
    </figure>

    <figure class="photo side">
      <span class="tape" aria-hidden="true"></span>
      <img src="./assets/img/photo-2.jpg" alt="Darya in sunglasses">
    </figure>

    <div class="note" aria-hidden="true">
      <div class="script" data-i18n="note"><span>Coming</span><span>soon</span></div>
      <svg class="heart" viewBox="0 0 30 30"><path d="M15 26 C4 18 2 12 5 8 C8 4 13 6 15 11 C17 6 23 4 26 8 C29 13 24 19 15 26Z" fill="none" stroke="#3b2a22" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>

    <svg class="swirl" viewBox="0 0 500 160" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0 155 C110 130 200 95 290 70 C370 48 440 30 500 4" fill="none" stroke="#c8a15a" stroke-width="1.2" stroke-linecap="round" opacity=".75"/>
    </svg>
    <div class="daisy" aria-hidden="true">
      <svg class="stem" viewBox="0 0 220 320" preserveAspectRatio="none">
        <path d="M2 0 C12 70 30 140 70 200 C100 245 130 280 160 318" fill="none" stroke="#9c8448" stroke-width="2.2" stroke-linecap="round"/>
        <path d="M44 150 C20 138 -4 146 -20 168 C4 160 26 160 44 150Z" fill="#a89456" fill-opacity=".25" stroke="#9c8448" stroke-width="1.2"/>
      </svg>
      <img src="./assets/img/photo-3.png" alt="">
    </div>

    <svg class="sparkle" viewBox="0 0 34 34" aria-hidden="true"><path d="M8 4 L12 16 M22 2 L20 14 M30 12 L22 18" stroke="#dcb04a" stroke-width="2.4" stroke-linecap="round"/></svg>
  </section>

  <footer data-i18n="footer">© 2026 Darya Elagina · elaginadary.com</footer>
</div>

<script>
(function(){
  var dict = {
    en:{
      title:'A new space<br>is coming soon.',
      lead:'A little corner on the internet is taking shape – for ideas, stories, creative projects and everything that inspires me.',
      insta:'Follow on Instagram',
      note:'<span>Coming</span><span>soon</span>',
      footer:'© 2026 Darya Elagina · elaginadary.com',
      doc:'Darya Elagina — Coming soon'
    },
    de:{
      title:'Bald online.',
      lead:'Hier entsteht ein neuer Ort – für Ideen, Geschichten, kreative Projekte und alles, was mich inspiriert.',
      insta:'Auf Instagram folgen',
      note:'<span>Bald</span><span>online</span>',
      footer:'© 2026 Darya Elagina · elaginadary.com',
      doc:'Darya Elagina — Bald online'
    }
  };
  var page = document.getElementById('page');
  var buttons = document.querySelectorAll('.lang button');
  var current = 'en';

  function apply(lang, animate){
    if(!dict[lang] || (lang === current && animate)) return;
    var set = function(){
      document.querySelectorAll('[data-i18n]').forEach(function(el){
        var k = el.getAttribute('data-i18n');
        if(dict[lang][k] !== undefined) el.innerHTML = dict[lang][k];
      });
      document.documentElement.lang = lang;
      document.title = dict[lang].doc;
      buttons.forEach(function(b){ b.setAttribute('aria-pressed', b.dataset.lang === lang ? 'true' : 'false'); });
      current = lang;
    };
    if(animate){
      page.classList.add('fading');
      setTimeout(function(){ set(); page.classList.remove('fading'); }, 350);
    } else { set(); }
    try{ localStorage.setItem('lang', lang); }catch(e){}
  }

  buttons.forEach(function(b){ b.addEventListener('click', function(){ apply(b.dataset.lang, true); }); });

  var saved = null;
  try{ saved = localStorage.getItem('lang'); }catch(e){}
  if(saved === 'de'){ current = 'en'; apply('de', false); }
})();
</script>
</body>
</html>
