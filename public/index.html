<style>
:root{--paper:#f8f2e7;--paper2:#f3eadb;--ink:#3b2a22;--soft:#5a4a40;--gold:#c8a15a;--sky:#b9cde3;--kraft:#eadcc2;--shadow:0 18px 40px -14px rgba(70,45,25,.35),0 4px 10px -4px rgba(70,45,25,.18)}
*{box-sizing:border-box;margin:0;padding:0}html,body{min-height:100%}body{background:var(--paper);color:var(--ink);font-family:"Source Sans 3",system-ui,sans-serif;font-weight:300;overflow-x:hidden}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.45;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/><feColorMatrix values='0 0 0 0 .45 0 0 0 0 .36 0 0 0 0 .26 0 0 0 .08 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}body:after{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(900px 600px at 78% 30%,rgba(255,255,255,.55),transparent 60%),radial-gradient(700px 500px at 10% 100%,rgba(214,190,150,.18),transparent 65%)}
.page{position:relative;z-index:1;min-height:100vh;max-width:1440px;margin:0 auto;padding:44px clamp(16px,5vw,72px) 56px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);grid-template-rows:auto 1fr auto;column-gap:clamp(24px,4vw,64px)}
header{grid-column:1/-1;display:flex;justify-content:space-between;align-items:flex-start}.logo{position:relative;font-family:"Cormorant Garamond",serif;font-weight:500;font-size:clamp(26px,2.6vw,36px);letter-spacing:.01em;color:var(--ink);text-decoration:none;display:inline-block;padding-bottom:18px}.logo svg{position:absolute;left:34px;bottom:0;width:112px;height:18px}.lang{display:flex;align-items:center;gap:4px;border:1px solid rgba(59,42,34,.22);border-radius:999px;padding:5px;background:rgba(255,255,255,.35);backdrop-filter:blur(4px)}.lang button{font:500 13px/1 "Source Sans 3",sans-serif;letter-spacing:.08em;color:var(--ink);background:transparent;border:0;border-radius:999px;padding:10px 18px;cursor:pointer}.lang button[aria-pressed="true"]{background:var(--paper2);box-shadow:inset 0 0 0 1px rgba(200,161,90,.25)}.sep{width:1px;height:16px;background:rgba(59,42,34,.25)}

.collage{position:relative;min-height:640px;align-self:stretch}.wash{position:absolute;pointer-events:none;filter:blur(.4px)}.wash.w1{left:0;top:40%;width:34%;height:46%}.wash.w2{right:6%;top:3%;width:40%;height:34%}.wash.w3{left:30%;bottom:2%;width:46%;height:18%}.photo{position:absolute;background:#fbf8f2;padding:12px 12px 14px;box-shadow:var(--shadow);transition:transform .4s ease}.photo:hover{transform:rotate(0deg) translateY(-5px)}.photo img{display:block;width:100%;height:100%;object-fit:cover}.photo.main{left:9%;top:4%;width:60%;aspect-ratio:525/643;transform:rotate(-2.2deg)}.photo.side{right:0;top:13%;width:37%;aspect-ratio:528/620;transform:rotate(4deg);z-index:2}.tape{position:absolute;height:38px;width:120px;background:rgba(226,211,178,.78);z-index:3;clip-path:polygon(2% 8%,10% 0,22% 7%,36% 1%,50% 6%,64% 0,78% 6%,90% 1%,100% 9%,98% 92%,88% 100%,74% 94%,60% 100%,46% 95%,32% 100%,18% 94%,6% 100%,0 90%)}.photo.main .tape{top:-20px;left:30%;transform:rotate(-3deg)}.photo.side .tape{top:-16px;right:18%;width:92px;transform:rotate(8deg)}
.note{position:absolute;right:1%;bottom:4%;width:34%;min-width:220px;aspect-ratio:1.05/1;background:var(--kraft);z-index:1;clip-path:polygon(0 3%,6% 0,20% 2%,38% 0,55% 3%,72% 0,90% 2%,100% 0,98% 22%,100% 45%,97% 70%,100% 100%,78% 98%,56% 100%,34% 97%,14% 100%,0 98%,2% 70%,0 44%,3% 20%);transform:rotate(-3deg);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center}.script{font-family:"Mrs Saint Delafield",cursive;font-size:clamp(58px,5.4vw,86px);line-height:.78;transform:rotate(-12deg);text-align:center}.script span{display:block}.script span+span{padding-left:.8em}.heart{position:absolute;right:30%;bottom:13%;width:30px;height:30px}.daisy{position:absolute;left:0;top:58%;width:170px;z-index:4;pointer-events:none}.daisy img{width:100%;display:block;filter:drop-shadow(0 8px 10px rgba(80,60,30,.22))}.stem{position:absolute;left:48%;top:52%;width:130%;height:190%;z-index:1;overflow:visible}.sparkle{position:absolute;right:1%;top:10%;width:34px;height:34px}
footer{grid-column:1/-1;align-self:end;font-size:13px;letter-spacing:.04em;color:rgba(59,42,34,.55);padding-top:20px}@media(max-width:1000px){.page{grid-template-columns:1fr;grid-template-rows:auto auto auto auto}.copy{padding:48px 0 24px;max-width:none}.collage{min-height:0;aspect-ratio:1/1.02;margin-top:10px}}@media(max-width:600px){.page{padding:24px 16px 32px}.lang button{padding:9px 14px}.logo svg{left:24px;width:90px}.collage{aspect-ratio:1/1.35}.photo.main{left:0;top:4%;width:72%}.photo.side{width:46%;top:30%}.note{width:52%;min-width:0;right:0;bottom:2%}.script{font-size:48px}.daisy{left:-2%;top:60%;width:110px}.wash.w1{left:-6%;width:50%}.sparkle{top:26%}}
</style></head><body><div class="page" id="page"><header><a class="logo" href="#" aria-label="Darya Elagina">Darya Elagina<svg viewBox="0 0 112 18" aria-hidden="true"><path d="M2 14 C30 4 70 2 110 7" fill="none" stroke="#c8a15a" stroke-width="2" stroke-linecap="round"/></svg></a><div class="lang" role="group" aria-label="Language"><button type="button" data-lang="en" aria-pressed="true">EN</button><span class="sep"></span><button type="button" data-lang="de" aria-pressed="false">DE</button></div></header><main class="copy"><h1 data-i18n="title">A new space<br>is coming soon.</h1><p class="lead" data-i18n="lead">A little corner on the internet is taking shape – for ideas, stories, creative projects and everything that inspires me.</p><svg class="swash" viewBox="0 0 110 22" aria-hidden="true"><path d="M3 18 C35 6 70 3 107 5" fill="none" stroke="#dcc08a" stroke-width="2.4" stroke-linecap="round"/></svg></main><section class="collage" aria-label="Photos"><svg class="wash w1" viewBox="0 0 300 380" preserveAspectRatio="none" aria-hidden="true"><path fill="#b9cde3" fill-opacity=".7" d="M60 20 C120 0 170 40 150 110 C135 170 210 220 230 290 C245 350 170 380 120 350 C70 320 90 250 50 200 C10 150 0 60 60 20Z"/></svg><svg class="wash w2" viewBox="0 0 300 260" preserveAspectRatio="none" aria-hidden="true"><path fill="#b9cde3" fill-opacity=".6" d="M40 60 C110 10 230 0 280 40 C300 80 250 120 200 140 C140 165 110 230 60 220 C20 210 0 110 40 60Z"/></svg><svg class="wash w3" viewBox="0 0 300 120" preserveAspectRatio="none" aria-hidden="true"><path fill="#b9cde3" fill-opacity=".5" d="M10 70 C60 20 180 10 290 40 C260 90 160 110 60 110 C20 110 0 90 10 70Z"/></svg><figure class="photo main"><span class="tape"></span><img src="./assets/img/photo-1.svg" alt="Darya with her dog in a city café"></figure><figure class="photo side"><span class="tape"></span><img src="./assets/img/photo-2.svg" alt="Darya in sunglasses"></figure><div class="note"><div class="script"><span data-i18n="note1">coming</span><span data-i18n="note2">soon</span></div><svg class="heart" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 27 C6 19 3 14 5 9 C7 5 12 5 16 10 C20 5 25 5 27 9 C29 14 26 19 16 27Z" fill="none" stroke="#3b2a22" stroke-width="1.7"/></svg></div><div class="daisy"><img src="./assets/img/photo-3.svg" alt=""><svg class="stem" viewBox="0 0 220 360" aria-hidden="true"><path d="M95 4 C60 90 170 155 80 360" fill="none" stroke="#7c7a4d" stroke-width="3" stroke-linecap="round"/></svg></div><svg class="sparkle" viewBox="0 0 34 34" aria-hidden="true"><path d="M17 1 L20 14 L33 17 L20 20 L17 33 L14 20 L1 17 L14 14Z" fill="none" stroke="#c8a15a" stroke-width="1.5"/></svg></section><footer>© 2026 · Darya Elagina</footer></div><script>const t={en:{title:'A new space<br>is coming soon.',lead:'A little corner on the internet is taking shape – for ideas, stories, creative projects and everything that inspires me.',note1:'coming',note2:'soon'},de:{title:'Ein neuer Ort<br>entsteht gerade.',lead:'Eine kleine Ecke im Internet nimmt Form an – für Ideen, Geschichten, kreative Projekte und alles, was mich inspiriert.',note1:'bald',note2:'online'}};const p=document.getElementById('page');document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{const l=b.dataset.lang;document.documentElement.lang=l;document.querySelectorAll('[data-lang]').forEach(x=>x.setAttribute('aria-pressed',x===b?'true':'false'));document.querySelectorAll('[data-i18n]').forEach(n=>{const k=n.dataset.i18n;if(t[l][k])n.innerHTML=t[l][k]})});</script></body></html>
